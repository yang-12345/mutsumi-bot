plugins {
    id 'java'
}

group = 'io.github.rikkakawaii0612.mutsumi.numberBomb'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // SLF4J & Logback: Logger
    compileOnly 'org.slf4j:slf4j-api:2.0.16'
    compileOnly 'ch.qos.logback:logback-classic:1.5.13'

    compileOnly project(':api')
}

jar {
    manifest {
        attributes(
                'Service-Id': 'number-bomb',
                'Service-Class': 'io.github.rikkakawaii0612.mutsumi.numberBomb.NumberBombService',
                'Service-Version': project.version,
                'Service-Author': 'RikkaKawaii0612'
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

test {
    useJUnitPlatform()
}